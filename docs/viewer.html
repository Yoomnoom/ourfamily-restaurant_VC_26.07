<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 화면 뷰어</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f0eded; color: #1b1c1c; display: flex; height: 100vh; overflow: hidden; }

  .sidebar { width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid #e4e2e2; padding: 16px 12px; overflow-y: auto; }
  .sidebar h1 { font-size: 15px; margin: 4px 4px 12px; }
  .mode-tabs { display: flex; flex-direction: column; gap: 4px; background: #f0eded; border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .mode-tab { padding: 8px 10px; border-radius: 9px; border: none; background: transparent; cursor: pointer; font-size: 12px; color: #45474a; text-align: left; }
  .mode-tab.active { background: #1b1c1c; color: #fff; }
  .base-url { width: 100%; font-size: 12px; padding: 8px; border-radius: 8px; border: 1px solid #c6c6ca; margin-bottom: 14px; }
  .step-btn { text-align: left; width: 100%; padding: 10px 12px; border-radius: 10px; border: none; background: transparent; cursor: pointer; font-size: 14px; color: #1b1c1c; margin-bottom: 4px; display: block; }
  .step-btn:hover { background: #f0eded; }
  .step-btn.active { background: #5d5e62; color: #fff; font-weight: 600; }
  .step-btn .path { display: block; font-size: 11px; opacity: .65; margin-top: 2px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #e4e2e2; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 16px; }
  .topbar .title { font-size: 14px; color: #45474a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device-group { display: flex; gap: 4px; background: #f0eded; border-radius: 999px; padding: 3px; }
  .device-btn { padding: 7px 12px; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 12px; color: #45474a; }
  .device-btn.active { background: #1b1c1c; color: #fff; }
  .reload-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid #c6c6ca; background: #fff; cursor: pointer; font-size: 12px; }

  .frame-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px; }
  .device-frame { border-radius: 28px; border: 10px solid #1b1c1c; box-shadow: 0 12px 32px rgba(0,0,0,.18); overflow: hidden; background: #fff; transition: width .15s, height .15s; }
  .device-frame.desktop { border-radius: 10px; border-width: 4px; }
  .device-frame iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<aside class="sidebar">
  <h1>우리집식당 화면</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="mine">내 스냅샷 (실제 앱 CSS)</button>
    <button class="mode-tab" data-mode="design">원본 디자인 목업</button>
    <button class="mode-tab" data-mode="live">실제 배포</button>
  </div>
  <input id="baseUrl" class="base-url" value="https://ourfamily-restaurant-vc-26-07.vercel.app" style="display:none" title="localhost:3000으로 바꾸면 로컬 dev 서버를 봅니다" />
  <div id="steps"></div>
</aside>
<main class="main">
  <div class="topbar">
    <span class="title" id="titleLabel"></span>
    <div style="display:flex; gap:8px;">
      <div class="device-group" id="deviceGroup"></div>
      <button class="reload-btn" onclick="reload()">새로고침</button>
    </div>
  </div>
  <div class="frame-wrap">
    <div class="device-frame" id="frame">
      <iframe id="screen"></iframe>
    </div>
  </div>
</main>
<script>
  // "내 스냅샷": 실제 app/globals.css를 그대로 복사해서 지금 앱과 100% 같은 스타일로 만든 것.
  var MINE_SCREENS = [
    ["design/01. 로그인/code.html", "1. 로그인"],
    ["design/02. 온보딩/code.html", "2. 온보딩"],
    ["design/03. 홈-오늘식사/code.html", "3. 홈 (오늘 식사 있음)"],
    ["design/04. 홈-빈상태/code.html", "4. 홈 (빈 상태)"],
    ["design/05. 내식탁/code.html", "5. 내 식탁"],
    ["design/06. 달력/code.html", "6. 달력"],
    ["design/07. 기록/code.html", "7. 기록"],
    ["design/08. 식사만들기/code.html", "8. 식사 만들기"],
    ["design/09. 식사만들기-완료/code.html", "9. 식사 만들기 완료"],
    ["design/10. 게스트응답/code.html", "10. 게스트 응답"],
    ["design/11. 게스트응답-완료/code.html", "11. 게스트 응답 완료"],
    ["design/12. 게스트응답-오류/code.html", "12. 게스트 응답 오류"],
    ["design/13. 알림패널/code.html", "13. 알림 패널"],
    ["design/14. 전체메뉴/code.html", "14. 전체 메뉴"],
    ["design/15. 가구선택/code.html", "15. 가구 선택"],
    ["design/16. 가족구성원/code.html", "16. 가족 구성원"]
  ];
  // "원본 디자인": 수업34일차_우리집식당_임시디자인2를 그대로 복사해온 것. Tailwind CDN 사용, 인터넷 필요.
  // (구현)/(부분 구현)/(미구현)/(범위 밖) 태그는 docs/screen-specs.md 참고.
  var DESIGN_SCREENS = [
    ["design/1-1. 온보딩-회원가입/code.html", "1-1. 온보딩 회원가입"],
    ["design/1-2. 온보딩-시작하기/code.html", "1-2. 온보딩 시작하기 (구현)"],
    ["design/1-3. 온보딩-가구프로필/code.html", "1-3. 온보딩 가구 프로필"],
    ["design/1-4. 온보딩-가족구성원/code.html", "1-4. 온보딩 가족 구성원"],
    ["design/2-1.로그인 화면/code.html", "2-1. 로그인 화면"],
    ["design/2-2. 로그인/code.html", "2-2. 로그인 (구현)"],
    ["design/3-0. 홈/code.html", "3-0. 홈 (구현)"],
    ["design/3-1. 내 식탁/code.html", "3-1. 내 식탁 (구현)"],
    ["design/3-2. 식사 만들기/code.html", "3-2. 식사 만들기 (구현)"],
    ["design/3-3. 참여자 응답/code.html", "3-3. 참여자 응답 (구현: 게스트 응답)"],
    ["design/3-4. 확정 전 요약/code.html", "3-4. 확정 전 요약 (미구현)"],
    ["design/3-5. 오늘의 식탁 완성/code.html", "3-5. 오늘의 식탁 완성 (미구현)"],
    ["design/3-7. 홈 빈 상태/code.html", "3-7. 홈 빈 상태 (구현)"],
    ["design/3-8. 참여자 링크 공유/code.html", "3-8. 참여자 링크 공유 (구현)"],
    ["design/3-9. 무가입 응답 연결/code.html", "3-9. 무가입 응답 연결 (구현)"],
    ["design/4-1. 홈 달력뷰/code.html", "4-1. 달력 (구현)"],
    ["design/5-1. 가구 설정/code.html", "5-1. 가구 설정 (부분 구현)"],
    ["design/5-2. 식사 기록/code.html", "5-2. 식사 기록 (구현)"],
    ["design/5-3. 설정/code.html", "5-3. 설정 (미구현)"],
    ["design/5-4. 요일별 기본 응답/code.html", "5-4. 요일별 기본 응답 (범위 밖)"],
    ["design/6-1. 오류·복구 상태/code.html", "6-1. 오류·복구 상태 (참고)"],
    ["design/7-1. 우리집 냉장고/code.html", "7-1. 우리집 냉장고 (범위 밖)"],
    ["design/7-3. 메뉴 추천/code.html", "7-3. 메뉴 추천 (범위 밖)"],
    ["design/8-1. 밀키트 주문/code.html", "8-1. 밀키트 주문 (범위 밖)"],
    ["design/8-2. 식사 사진 기록/code.html", "8-2. 식사 사진 기록 (범위 밖)"],
    ["design/8-3. 식비 예산/code.html", "8-3. 식비 예산 (범위 밖)"],
    ["design/8-4. 정산/code.html", "8-4. 정산 (범위 밖)"]
  ];
  var LIVE_ROUTES = [
    ["/login", "로그인 (매직링크 + 패스키)"],
    ["/", "홈 (로그인 필요)"],
    ["/tables", "내 식탁"],
    ["/calendar", "달력"],
    ["/records", "기록"],
    ["/meals/new", "식사 만들기"],
    ["/respond/demo", "게스트 응답 (없는 토큰)"]
  ];
  var LISTS = { mine: MINE_SCREENS, design: DESIGN_SCREENS, live: LIVE_ROUTES };
  var DEVICES = [
    ["mobile", "모바일", 390, 844],
    ["tablet", "태블릿", 768, 1024],
    ["desktop", "데스크톱", 1280, 800]
  ];
  var mode = "mine";
  var currentDevice = DEVICES[0];
  var currentPath = { mine: MINE_SCREENS[0][0], design: DESIGN_SCREENS[0][0], live: LIVE_ROUTES[0][0] };

  function setMode(next) {
    mode = next;
    document.querySelectorAll(".mode-tab").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-mode") === mode);
    });
    document.getElementById("baseUrl").style.display = mode === "live" ? "block" : "none";
    render();
    load();
  }

  function render() {
    var list = LISTS[mode];
    var stepsEl = document.getElementById("steps");
    stepsEl.innerHTML = "";
    list.forEach(function (r) {
      var btn = document.createElement("button");
      btn.className = "step-btn" + (r[0] === currentPath[mode] ? " active" : "");
      btn.innerHTML = r[1] + '<span class="path">' + r[0] + "</span>";
      btn.onclick = function () { currentPath[mode] = r[0]; load(); render(); };
      stepsEl.appendChild(btn);
    });

    var deviceGroup = document.getElementById("deviceGroup");
    deviceGroup.innerHTML = "";
    DEVICES.forEach(function (d) {
      var btn = document.createElement("button");
      btn.className = "device-btn" + (d[0] === currentDevice[0] ? " active" : "");
      btn.textContent = d[1];
      btn.onclick = function () { currentDevice = d; applySize(); render(); };
      deviceGroup.appendChild(btn);
    });

    document.getElementById("titleLabel").textContent = currentPath[mode] + " · " + currentDevice[1] + " (" + currentDevice[2] + "×" + currentDevice[3] + ")";
  }

  function applySize() {
    var frame = document.getElementById("frame");
    frame.style.width = currentDevice[2] + "px";
    frame.style.height = currentDevice[3] + "px";
    frame.classList.toggle("desktop", currentDevice[0] === "desktop");
  }

  function load() {
    if (mode === "live") {
      var base = document.getElementById("baseUrl").value.replace(/\/$/, "");
      document.getElementById("screen").src = base + currentPath.live;
    } else {
      document.getElementById("screen").src = currentPath[mode];
    }
  }

  function reload() { load(); }

  document.querySelectorAll(".mode-tab").forEach(function (btn) {
    btn.addEventListener("click", function () { setMode(btn.getAttribute("data-mode")); });
  });
  document.getElementById("baseUrl").addEventListener("change", load);
  applySize();
  render();
  load();
</script>
</body>
</html>
