<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 내 식탁</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="brand" aria-label="홈으로"><span>♜</span>우리집식당</button>
    <button class="household">우리집⌄</button>
    <div class="top-actions">
      <button class="icon-button" aria-label="알림 열기"><span class="icon" aria-hidden="true">♢</span></button>
      <button class="icon-button" aria-label="전체 메뉴 열기"><span class="icon" aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main class="content">
    <div class="page-head"><h1>내 식탁</h1><p>내가 만들거나 참여하는 식사</p></div>
    <div class="stack">
      <article class="card meal-card">
        <div class="meal-art"><span class="icon" aria-hidden="true">♨</span></div>
        <div class="meal-copy">
          <p class="eyebrow">오늘의 식탁</p>
          <p class="muted">8월 18일 화요일 · 19:00</p>
          <h2>김치찌개</h2>
          <p class="counts"><strong>2명 먹어요</strong><span>0명 안 먹어요</span><em>2명 확인 전</em></p>
          <div class="actions"><button>현재 인원으로 확정</button></div>
        </div>
      </article>
      <article class="card meal-card">
        <div class="meal-art"><span class="icon" aria-hidden="true">♨</span></div>
        <div class="meal-copy">
          <p class="eyebrow">응답이 필요해요</p>
          <p class="muted">8월 19일 수요일 · 18:30</p>
          <h2>불고기</h2>
          <p class="counts"><strong>1명 먹어요</strong><span>0명 안 먹어요</span><em>3명 확인 전</em></p>
          <div class="actions"><button>먹어요</button><button class="secondary">안 먹어요</button></div>
        </div>
      </article>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <button><span class="icon" aria-hidden="true">⌂</span><span>홈</span></button>
    <button aria-current="page"><span class="icon" aria-hidden="true">♟</span><span>내 식탁</span></button>
    <button class="create"><span class="icon" aria-hidden="true">+</span><span>식사 만들기</span></button>
    <button><span class="icon" aria-hidden="true">▦</span><span>달력</span></button>
    <button><span class="icon" aria-hidden="true">▤</span><span>기록</span></button>
  </nav>
</div>
</body>
</html>
