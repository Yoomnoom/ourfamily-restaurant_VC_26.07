<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 전체 메뉴</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body style="background:var(--bg)">
<div class="scrim">
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="전체 메뉴">
    <div class="drawer-head">
      <h2>전체 메뉴</h2>
      <button class="icon-button" aria-label="닫기"><span class="icon" aria-hidden="true">×</span></button>
    </div>
    <section class="menu-group">
      <h3>가족과 가구</h3>
      <button>가족 구성원<span>›</span></button>
    </section>
    <section class="menu-group">
      <h3>반복 설정</h3>
      <button>요일별 기본 응답<span>›</span></button>
      <button>반복 식사 관리<span>›</span></button>
      <button>자주 가는 곳<span>›</span></button>
      <button>알림 설정<span>›</span></button>
    </section>
    <section class="menu-group">
      <h3>살림과 제안</h3>
      <button>우리집 냉장고<span>›</span></button>
      <button>밀키트 둘러보기<span>›</span></button>
    </section>
    <section class="menu-group">
      <h3>서비스</h3>
      <button>지문 로그인 등록<span>›</span></button>
      <button>계정 설정<span>›</span></button>
      <button>도움말<span>›</span></button>
      <button>개인정보 및 데이터<span>›</span></button>
    </section>
    <button class="reset" style="width:100%">로그아웃</button>
  </aside>
</div>
</body>
</html>
