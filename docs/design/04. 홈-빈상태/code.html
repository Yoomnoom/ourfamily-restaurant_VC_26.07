<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 홈 빈 상태</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="brand" aria-label="홈으로"><span>♜</span>우리집식당</button>
    <button class="household">우리집⌄</button>
    <div class="top-actions">
      <button class="icon-button" aria-label="알림 열기"><span class="icon" aria-hidden="true">♢</span></button>
      <button class="icon-button" aria-label="전체 메뉴 열기"><span class="icon" aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main class="content">
    <h1 class="greeting">좋은 저녁이에요, 김영희 님</h1>
    <section class="card empty">
      <div class="empty-art">⌂<span>♧</span></div>
      <h2>오늘 열린 식사가 없어요</h2>
      <p>식사를 만들면 가족에게 누가 먹는지<br />바로 물어볼 수 있어요.</p>
      <button>오늘 식사 만들기</button>
    </section>
    <button class="card strip"><span class="icon" aria-hidden="true">▦</span><span><b>앞으로 예정된 식사 0개</b><small>미리 답해두고 조율을 줄여보세요</small></span><strong>미리 답해두기 ›</strong></button>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <button aria-current="page"><span class="icon" aria-hidden="true">⌂</span><span>홈</span></button>
    <button><span class="icon" aria-hidden="true">♟</span><span>내 식탁</span></button>
    <button class="create"><span class="icon" aria-hidden="true">+</span><span>식사 만들기</span></button>
    <button><span class="icon" aria-hidden="true">▦</span><span>달력</span></button>
    <button><span class="icon" aria-hidden="true">▤</span><span>기록</span></button>
  </nav>
</div>
</body>
</html>
