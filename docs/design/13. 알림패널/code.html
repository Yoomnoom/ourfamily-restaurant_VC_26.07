<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 알림 패널</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body style="background:var(--bg)">
<div class="scrim">
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="알림">
    <div class="drawer-head">
      <h2>알림</h2>
      <button>모두 읽음</button>
      <button class="icon-button" aria-label="닫기"><span class="icon" aria-hidden="true">×</span></button>
    </div>
    <div class="notification-list">
      <button><span class="avatar">!</span><span><b>이지은 님이 응답을 바꿨어요</b><small>김치찌개 · 방금</small></span></button>
      <button><span class="avatar">!</span><span><b>김하준 님이 아직 응답하지 않았어요</b><small>오늘 저녁 · 12분 전</small></span></button>
      <button class="read"><span class="avatar">✓</span><span><b>내일 불고기 식사가 열렸어요</b><small>1시간 전</small></span></button>
    </div>
  </aside>
</div>
</body>
</html>
