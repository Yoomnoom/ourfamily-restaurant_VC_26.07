<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 가족 구성원</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body style="background:var(--bg)">
<div class="scrim">
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="가족 구성원">
    <div class="drawer-head">
      <h2>가족 구성원</h2>
      <button class="icon-button" aria-label="닫기"><span class="icon" aria-hidden="true">×</span></button>
    </div>
    <div class="notification-list">
      <div class="strip" style="cursor:default"><span class="avatar">김</span><span><b>김영희</b><small>오너</small></span></div>
      <div class="strip" style="cursor:default"><span class="avatar">박</span><span><b>박철수</b><small>공동 관리자</small></span><button class="secondary">내보내기</button></div>
      <div class="strip" style="cursor:default"><span class="avatar">이</span><span><b>이지은</b><small>구성원</small></span><button class="secondary">내보내기</button></div>
      <div style="padding:17px 20px"><button class="secondary">초대 코드 만들기</button></div>
    </div>
    <button class="reset">닫기</button>
  </aside>
</div>
</body>
</html>
