<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 온보딩</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css" />
<style>:root{--font-serif:'Noto Serif KR',serif;--font-sans:'Plus Jakarta Sans',Pretendard,sans-serif}</style>
</head>
<body>
<main class="guest-page warm-table">
  <div class="guest-brand wt-serif">우리집식당</div>
  <section class="guest-intro">
    <h1 class="wt-serif">우리집을 시작해요</h1>
    <p>새 가구를 만들거나, 가족에게 받은 초대 코드로 참여해요.</p>
  </section>
  <form class="card response-form">
    <label>가구 이름<input placeholder="예: 우리집" /></label>
    <button class="submit" type="button">가구 만들기</button>
  </form>
  <form class="card response-form">
    <label>초대 코드<input placeholder="가족에게 받은 코드" /></label>
    <button class="submit" type="button">코드로 참여하기</button>
  </form>
</main>
</body>
</html>
