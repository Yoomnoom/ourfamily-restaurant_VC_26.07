<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 달력</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="brand" aria-label="홈으로"><span>♜</span>우리집식당</button>
    <button class="household">우리집⌄</button>
    <div class="top-actions">
      <button class="icon-button" aria-label="알림 열기"><span class="icon" aria-hidden="true">♢</span></button>
      <button class="icon-button" aria-label="전체 메뉴 열기"><span class="icon" aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main class="content">
    <div class="page-head"><h1>식사 달력</h1></div>
    <section class="card calendar">
      <div class="month"><button aria-label="이전 달" disabled>‹</button><h2>2026년 8월</h2><button aria-label="다음 달" disabled>›</button></div>
      <div class="weekdays"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div>
      <div class="days">
        <button disabled></button><button disabled></button><button disabled></button><button disabled></button><button disabled></button><button disabled></button><button><span>1</span></button>
        <button><span>2</span></button><button><span>3</span></button><button><span>4</span></button><button><span>5</span></button><button><span>6</span></button><button><span>7</span></button><button><span>8</span></button>
        <button><span>9</span></button><button><span>10</span></button><button><span>11</span></button><button><span>12</span></button><button><span>13</span></button><button><span>14</span></button><button><span>15</span></button>
        <button><span>16</span></button><button><span>17</span></button><button class="selected"><span>18</span><small>•<br />김치찌개</small></button><button><span>19</span><small>•<br />불고기</small></button><button><span>20</span></button><button><span>21</span></button><button><span>22</span></button>
      </div>
    </section>
    <section class="card date-detail">
      <span class="icon" aria-hidden="true">♨</span>
      <div><h2>8월 18일 화요일</h2><p>오늘 · 김치찌개 · 19:00</p></div>
      <strong>응답 필요 ›</strong>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <button><span class="icon" aria-hidden="true">⌂</span><span>홈</span></button>
    <button><span class="icon" aria-hidden="true">♟</span><span>내 식탁</span></button>
    <button class="create"><span class="icon" aria-hidden="true">+</span><span>식사 만들기</span></button>
    <button aria-current="page"><span class="icon" aria-hidden="true">▦</span><span>달력</span></button>
    <button><span class="icon" aria-hidden="true">▤</span><span>기록</span></button>
  </nav>
</div>
</body>
</html>
