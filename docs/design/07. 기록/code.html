<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 기록</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="brand" aria-label="홈으로"><span>♜</span>우리집식당</button>
    <button class="household">우리집⌄</button>
    <div class="top-actions">
      <button class="icon-button" aria-label="알림 열기"><span class="icon" aria-hidden="true">♢</span></button>
      <button class="icon-button" aria-label="전체 메뉴 열기"><span class="icon" aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main class="content">
    <div class="page-head"><h1>식사 기록</h1><p>지난 결정은 다시 써요</p></div>
    <section class="card stats">
      <h2>한눈에 보기</h2>
      <div>
        <span><span class="icon" aria-hidden="true">♟</span><small>함께 먹은 식사</small><b>12번</b></span>
        <span><span class="icon" aria-hidden="true">♟</span><small>평균 참여</small><b>4명</b></span>
        <span><span class="icon" aria-hidden="true">♨</span><small>자주 먹은 메뉴</small><b>찌개</b></span>
      </div>
    </section>
    <div class="stack">
      <article class="card record">
        <div class="meal-art"><span class="icon" aria-hidden="true">♨</span></div>
        <div><p class="muted">8월 15일 토요일</p><h2>제육볶음</h2><p>4명 함께 먹었어요</p><button class="secondary">같은 구성으로 만들기</button></div>
      </article>
      <article class="card record">
        <div class="meal-art"><span class="icon" aria-hidden="true">♨</span></div>
        <div><p class="muted">8월 10일 월요일</p><h2>된장찌개</h2><p>3명 함께 먹었어요</p><button class="secondary">같은 구성으로 만들기</button></div>
      </article>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <button><span class="icon" aria-hidden="true">⌂</span><span>홈</span></button>
    <button><span class="icon" aria-hidden="true">♟</span><span>내 식탁</span></button>
    <button class="create"><span class="icon" aria-hidden="true">+</span><span>식사 만들기</span></button>
    <button><span class="icon" aria-hidden="true">▦</span><span>달력</span></button>
    <button aria-current="page"><span class="icon" aria-hidden="true">▤</span><span>기록</span></button>
  </nav>
</div>
</body>
</html>
