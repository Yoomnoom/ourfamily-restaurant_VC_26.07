<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리집식당 - 홈</title>
<link rel="stylesheet" href="../shared.css" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="brand" aria-label="홈으로"><span>♜</span>우리집식당</button>
    <button class="household">우리집⌄</button>
    <div class="top-actions">
      <button class="icon-button" aria-label="알림 열기"><span class="icon" aria-hidden="true">♢</span><i></i></button>
      <button class="icon-button" aria-label="전체 메뉴 열기"><span class="icon" aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main class="content">
    <h1 class="greeting">좋은 저녁이에요, 김영희 님</h1>
    <article class="card meal-card">
      <div class="meal-art"><span class="icon" aria-hidden="true">♨</span></div>
      <div class="meal-copy">
        <p class="eyebrow">오늘의 식탁</p>
        <p class="muted">8월 18일 화요일 · 19:00</p>
        <h2>김치찌개</h2>
        <p class="counts"><strong>2명 먹어요</strong><span>0명 안 먹어요</span><em>2명 확인 전</em></p>
        <div class="actions"><button>현재 인원으로 확정</button></div>
      </div>
    </article>
    <section class="card todo">
      <div><p class="eyebrow">내가 할 일 <em>!</em></p><h3><strong>2명</strong>이 아직 응답하지 않았어요</h3></div>
      <button class="secondary">미응답자에게 알리기</button>
    </section>
    <button class="card strip"><span class="icon" aria-hidden="true">▦</span><span><b>앞으로 예정된 식사 1개</b><small>미리 답해두고 조율을 줄여보세요</small></span><strong>미리 답해두기 ›</strong></button>
    <section>
      <h2 class="section-title">가족이 먹고 싶어 해요</h2>
      <div class="card request-list">
        <button><span class="avatar">박</span><span>박철수 · <b>삼겹살</b></span><strong>이걸로 만들기 ›</strong></button>
        <button><span class="avatar">이</span><span>이지은 · <b>비빔국수</b></span><strong>이걸로 만들기 ›</strong></button>
      </div>
    </section>
    <button class="card strip"><span class="icon" aria-hidden="true">♨</span><span><b>지난 식사 다시 만들기</b><small>가족이 함께 먹은 구성을 불러와요</small></span><strong>›</strong></button>
  </main>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <button aria-current="page"><span class="icon" aria-hidden="true">⌂</span><span>홈</span></button>
    <button><span class="icon" aria-hidden="true">♟</span><span>내 식탁</span></button>
    <button class="create"><span class="icon" aria-hidden="true">+</span><span>식사 만들기</span></button>
    <button><span class="icon" aria-hidden="true">▦</span><span>달력</span></button>
    <button><span class="icon" aria-hidden="true">▤</span><span>기록</span></button>
  </nav>
</div>
</body>
</html>
